services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency"]
      interval: 5s
      retries: 10

  api:
    build: .
    profiles: ["app"]  # `docker compose --profile app up` to run the API in a container too
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://agency:agency@postgres:5432/agency
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

volumes:
  pgdata:
